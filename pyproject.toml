# Cohort Data Builder: Python tooling only (tests, supplied-data checks, linting).
# The product itself is the static site in site/; nothing here is packaged.

[project]
name = "cohort-data-builder"
version = "0.0.0"
description = "Test and lint tooling for the Cohort Data Builder static site."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["PoC", "site/templates", "tools", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = ["D"]
"tests/**/conftest.py" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["scripts"]
markers = [
  "e2e: browser tests against the served site",
  "needs_r: needs Rscript with the haven package",
]

[dependency-groups]
dev = [
    "axe-playwright-python==0.1.8",
    "pandas==3.1.0",
    "pyreadstat==1.3.7",
    "pytest==9.1.1",
    "pytest-playwright==0.10.0",
    "ruff==0.17.2",
]
