# An example topic scheme for Topic Tagger, bundled with it. Pass it with `--scheme`.
#
# Two levels: DOMAINS (topic areas) and the TOPICS inside them. The model tags each
# variable with one or more topics, each with a confidence from 0 to 1.
#
# Based on the CLOSER Discovery controlled vocabulary, the two-level topic scheme CLOSER
# uses to index questions and variables from UK longitudinal studies, built from MeSH and
# ELSST terms:
#   https://github.com/CLOSER-Cohorts/archivist (test/fixtures/topics.yml)
#   https://doi.org/10.1093/ije/dyz004 (CLOSER data resource profile)
# `closer` is the CLOSER topic code. `cessda` names the nearest top-level term in the CESSDA
# Topic Classification: https://vocabularies.cessda.eu/vocabulary/TopicClassification
# Topics CLOSER does not have are marked `added = true`.
#
# EDITING: copy this file with `topic-tagger init-scheme my-scheme.toml`, edit the copy and
# pass it with `--scheme`. Ids are what gets stored, so rename an id only if you mean to
# retag. Labels, descriptions and the guidance can change freely, but the model reads them,
# so any edit makes existing tags out of date and the next run redoes them.

name = "CLOSER topics"
version = 1
fallback_topic = "other"

# Instructions given to the model, before the topics.
guidance = '''
You are classifying variables from a UK longitudinal cohort study by topic,
for researchers searching for variables to use.
- Tag what the variable MEASURES, not who answered: a parent's report of the
  child's asthma is respiratory_system, not family_members.
- Use every topic that genuinely applies: a main topic, plus any secondary
  ones the variable would also be found under. "Rent amount" is housing
  (0.9) and consumption (0.5); "Age first owned a property" is housing (0.9)
  and assets (0.6); "Mother smoked during pregnancy" is smoking (0.9) and
  pregnancy_history (0.9).
- Confidence is how sure you are the topic applies, from 0 to 1. Use high
  values (0.8+) only when the label makes it clear; leave out anything
  below 0.3.
- Derived variables, flags and weights still get a topic for what they are.
- If nothing fits, use `other` with a low confidence.
'''

